<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 468" width="820" height="468" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="t">Static scanner vs AI vs both, on real CVEs (local 7B model)</title>
<desc id="d">Human-labelled, verifier on. Blue: vulnerable code caught (higher is better). Orange: patched code still flagged (lower is better).</desc>
<style>:root{--surface:#fcfcfb;--ink:#1d1d1b;--ink2:#5f5e58;--grid:#e4e3de;--s1:#2a78d6;--s2:#eb6834}@media (prefers-color-scheme: dark){:root{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--grid:#3a3a37;--s1:#3987e5;--s2:#d95926}}.bg{fill:var(--surface)}.t{fill:var(--ink);font-size:16px;font-weight:600}.st,.lab{fill:var(--ink2);font-size:12px}.row{fill:var(--ink);font-size:13px}.val{fill:var(--ink);font-size:12px;font-variant-numeric:tabular-nums}.grid{stroke:var(--grid);stroke-width:1}.s0{fill:var(--s1)}.s1{fill:var(--s2)}</style>
