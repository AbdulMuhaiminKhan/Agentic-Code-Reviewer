name: Agentic code review
# Reviews a pull request with a local model on a SELF-HOSTED runner (a machine you own, running Ollama),
# so no hosted LLM API and no paid CI minutes are involved.
#
# Manual-only on purpose: with no self-hosted runner registered, a pull_request trigger would leave every
# PR with a check stuck in "Queued". GitHub also advises against self-hosted runners on PUBLIC repositories,
# because pull requests can run code on your machine. Use it from a private repository:
#   1. Settings > Actions > Runners > New self-hosted runner (on the machine with Ollama + the model)
#   2. Actions > Agentic code review > Run workflow > enter the PR number
on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to review"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write   # lets GITHUB_TOKEN post the review comment

jobs:
  review:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr checkout ${{ inputs.pr }}
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Review and comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACR_PROVIDER: ollama
          ACR_MODEL: qwen2.5-coder:7b
        run: python -m acr.cli --repo ${{ github.repository }} --pr ${{ inputs.pr }} --local-repo . --ref HEAD --post
